# The repositories that the profile and the personal page show, by section
# and in order: a repository of another owner is owner/name. A card takes
# its name, description, language, stars and forks from GitHub. A new
# repository worth showing goes in a section.

sections:
  - id: projects
    title: {en: Projects, it: Progetti}
    repos:
      - SMSpp-Project/smspp-project
      - aimacode/aima-python
      - NeuroSAT
      - GQSAT
      - SicilianNMT
      - lemon-ng
      - ADS
      - PBeFS
      - optiml
      - SPSUnipi/pySMSpp
      - SPSUnipi/pypsa2smspp
      - qpsolvers/qpsolvers
  - id: earlier
    title: {en: Earlier projects, it: Progetti precedenti}
    repos: [WS4J, BeerEX, PESAD, WNAffect, FuzzyCLIPS, OnlineRetail]
  - id: tools
    title: {en: Tools, it: Strumenti}
    repos: [code-style, lamalunga]
