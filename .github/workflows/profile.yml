# The parts of the README that come from GitHub, written again once a day:
# the gists and the chart of the languages [see scripts/profile.py], and
# the snake that eats the contributions of the last year, on the branch
# output.
name: Profile

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install -q pyyaml

      - name: Write the generated parts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile.py README.md

      - name: Commit them if they changed
        run: |
          git add README.md assets
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "the generated parts of the profile, written again"
          git push

  # The same README on the GitLab profile (gitlab.com/dmeoli/dmeoli), pushed
  # with a deploy key that can write only there.
  gitlab:
    needs: readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to GitLab
        env:
          KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$HOME/gitlab_key"
          printf '%s\n' "$KEY" > "$HOME/gitlab_key"
          ssh-keyscan -t ed25519 gitlab.com > "$HOME/gitlab_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/gitlab_key -o UserKnownHostsFile=$HOME/gitlab_hosts"
          git push --force git@gitlab.com:dmeoli/dmeoli.git HEAD:main

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#7338a8&color_dots=#ebedf0,#e6dbef,#c4abda,#9d74c2,#7338a8
            dist/snake-dark.svg?palette=github-dark&color_snake=#d4b9eb&color_dots=#161b22,#32244a,#4e2c72,#7338a8,#ad85d0

      # one SVG that follows the color scheme of the viewer, for the <img>
      # of the README (GitLab drops <picture>): the two versions differ
      # only in the colors of :root
      - name: Write the automatic version
        shell: python3 {0}
        run: |
          import re
          light = open('dist/snake-light.svg').read()
          dark = open('dist/snake-dark.svg').read()
          root = re.search(r':root\{[^}]*\}', dark).group(0)
          with open('dist/snake-auto.svg', 'w') as f:
              f.write(light.replace('</style>', '@media (prefers-color-'
                                    'scheme: dark){%s}</style>' % root, 1))

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: the snake of the contributions, drawn again
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
